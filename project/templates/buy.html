{% extends "layout.html" %}

{% block title %}
     BUY
{% endblock %}

{% block main %}
<div class="section" id="loading">
    <form action="/buy" method="post">
        <div>
            <h1 style="text-align:center;">Buy</h1>
            <input autocomplete="off" autofocus class="form" name="symbol" placeholder="Stock name" type="text" style="width:100%;margin-top:40px;">
        </div>
        <div class="mb-3">
            <input class="form" name="shares" placeholder="Number of shares" type="number" style="width:100%;">
        </div>
        <p class="error-message" class="btn">{{error}}</p>
        <button class="btn form" type="submit"style="border-radius:10px;width:80%">Submit</button>
    </form>
{% endblock %}
