<script>
    let path = window.location.pathname;
        const title = document.getElementById("header");
        // Check the path and update the heading
        if (path === "/register") {
            title.textContent = "Register";
        }
        else {
            title.textContent = "Login";
        }
        if(path ==="/history")
        {
            document.getElementById("history").style.fontSize = "100px";
        }
